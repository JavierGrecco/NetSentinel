[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
dynamic = ["version"]
description = "Panel local para observabilidad, inventario y diagnóstico de redes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NetSentinel contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "psutil>=6.0,<8.0",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10.0", "httpx>=0.28.1,<1.0", "httpx2>=2.13.1,<3.0"]
ui-test = ["playwright>=1.48,<2.0"]

[project.scripts]
netsentinel = "netsentinel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "netsentinel.__version__"}

[tool.setuptools.package-data]
netsentinel = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
