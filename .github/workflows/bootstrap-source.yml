name: Bootstrap source tree
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !contains(github.event.head_commit.message, '[source-materialized]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/netsentinel-publish
          cat .bootstrap/part-*.b64 > /tmp/netsentinel-publish/source.tar.xz.b64
          test "$(wc -c < /tmp/netsentinel-publish/source.tar.xz.b64 | tr -d ' ')" = "39288"
          base64 --decode /tmp/netsentinel-publish/source.tar.xz.b64 > /tmp/netsentinel-publish/source.tar.xz
          echo "83d766200d7b8b39eaaa281a51afc85d9811e8583a1f657a86048479a37e9186  /tmp/netsentinel-publish/source.tar.xz" | sha256sum --check -
          tar -tJf /tmp/netsentinel-publish/source.tar.xz > /dev/null
      - name: Expand source, install, and test
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/netsentinel-publish/source.tar.xz -C .
          rm -rf .bootstrap .github/workflows/bootstrap-source.yml
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m compileall -q src tests
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish NetSentinel v0.2.0 [source-materialized]"
          git push
