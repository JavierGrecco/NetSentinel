name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -W error::starlette.exceptions.StarletteDeprecationWarning

  minimum-dependencies:
    name: Minimum declared dependencies (Python 3.10 / Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Install declared minimum runtime and test dependencies
        run: python -m pip install --constraint ci/constraints-min.txt -e ".[test]"
      - name: Run full test suite against minimum dependencies
        run: python -m pytest -W error::starlette.exceptions.StarletteDeprecationWarning

  package:
    name: Wheel metadata and static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify module boundaries
        run: python scripts/check_architecture_boundaries.py
      - name: Check minimum dependency constraints against project metadata
        run: python scripts/check-minimum-dependency-constraints.py
      - name: Verify minimum-dependency guard rejects metadata drift
        run: |
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          mkdir -p "$tempdir/scripts" "$tempdir/ci"
          cp pyproject.toml "$tempdir/pyproject.toml"
          cp ci/constraints-min.txt "$tempdir/ci/constraints-min.txt"
          cp scripts/check-minimum-dependency-constraints.py "$tempdir/scripts/check-minimum-dependency-constraints.py"
          python - "$tempdir/pyproject.toml" "$tempdir/expected-error.txt" <<'PY'
          from pathlib import Path
          import re
          import sys
          import tomllib

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          project = tomllib.loads(text)["project"]
          requirements = list(project.get("dependencies", []))
          requirements.extend(project.get("optional-dependencies", {}).get("test", []))
          requirement = next(
              (
                  item for item in requirements
                  if re.match(
                      r"^\s*[A-Za-z0-9_.-]+(?:\[[^]]+\])?\s*>=\s*[0-9]+(?:\.[0-9]+)*",
                      item,
                  )
              ),
              None,
          )
          assert requirement is not None, "Could not find a direct requirement with a numeric lower bound."
          package_match = re.match(r"^\s*([A-Za-z0-9_.-]+)", requirement)
          version_match = re.search(r">=\s*([0-9]+(?:\.[0-9]+)*)", requirement)
          assert package_match is not None, f"Could not parse the package name: {requirement!r}"
          assert version_match is not None, f"Could not parse the lower bound: {requirement!r}"

          version_parts = version_match.group(1).split(".")
          version_parts[-1] = str(int(version_parts[-1]) + 1)
          deliberately_wrong_version = ".".join(version_parts)
          mutated_requirement = (
              requirement[: version_match.start(1)]
              + deliberately_wrong_version
              + requirement[version_match.end(1) :]
          )
          original_entry = f'"{requirement}"'
          mutated_entry = f'"{mutated_requirement}"'
          assert original_entry in text, "Could not locate the selected requirement in pyproject.toml."
          path.write_text(text.replace(original_entry, mutated_entry, 1), encoding="utf-8")

          normalized_name = re.sub(r"[-_.]+", "-", package_match.group(1)).lower()
          Path(sys.argv[2]).write_text(
              f"Constraint mismatch for {normalized_name}", encoding="utf-8"
          )
          print(
              f"Testing guard with a deliberate lower-bound mismatch for {package_match.group(1)}: "
              f">= {deliberately_wrong_version}"
          )
          PY
          if python "$tempdir/scripts/check-minimum-dependency-constraints.py" > "$tempdir/output.txt" 2>&1; then
            echo "Minimum dependency guard accepted an intentionally mismatched lower bound." >&2
            cat "$tempdir/output.txt" >&2
            exit 1
          fi
          if ! grep -F -q -f "$tempdir/expected-error.txt" "$tempdir/output.txt"; then
            echo "Minimum dependency guard failed for an unexpected reason." >&2
            cat "$tempdir/output.txt" >&2
            exit 1
          fi
          echo "Minimum dependency guard correctly rejected metadata drift."
      - name: Validate launcher and release helper shell syntax
        run: bash -n run.sh run-macos.command scripts/verify-sha256-manifest.sh
      - name: Keep CodeQL initialization and analysis versions in sync
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/security.yml").read_text(encoding="utf-8")
          pattern = re.compile(
              r"uses:\s*github/codeql-action/(init|analyze)@([0-9a-f]{40})\s+#\s*(v[0-9.]+)"
          )
          refs = pattern.findall(workflow)
          assert len(refs) == 2, (
              "Expected exactly one SHA-pinned CodeQL init and analyze action, found: "
              f"{refs!r}"
          )
          actions = {name: (sha, version) for name, sha, version in refs}
          assert set(actions) == {"init", "analyze"}, (
              "The security workflow must use both CodeQL init and analyze actions."
          )
          assert actions["init"] == actions["analyze"], (
              "CodeQL init and analyze must use the same full commit SHA and release tag; "
              f"found {actions!r}"
          )

          dependabot = Path(".github/dependabot.yml").read_text(encoding="utf-8")
          assert "codeql-actions:" in dependabot and '"github/codeql-action/*"' in dependabot, (
              "Dependabot must group CodeQL actions so init/analyze are upgraded together."
          )
          print(f"Validated coordinated CodeQL action version {actions['init'][1]}.")
          PY
      - name: Validate repository security policy is current
        run: |
          python - <<'PY'
          from pathlib import Path

          root_policy = Path("SECURITY.md").read_text(encoding="utf-8")
          technical_policy = Path("docs/SECURITY.md").read_text(encoding="utf-8")
          required_root_phrases = (
              "Report a vulnerability",
              "solo permite direcciones loopback",
              "docs/SECURITY.md",
              "No publiques detalles explotables",
          )
          missing = [phrase for phrase in required_root_phrases if phrase not in root_policy]
          assert not missing, f"Root security policy is missing required guidance: {missing}"
          assert "0.7.3" not in root_policy, "Root security policy must not reference the obsolete version 0.7.3"
          assert "abrí un issue con una descripción mínima" not in technical_policy, (
              "Security vulnerability instructions must not direct users to public issues"
          )
          assert "solicita un canal privado" in technical_policy, (
              "Technical security policy must provide a private reporting fallback"
          )
          PY
      - name: Test release checksum verification and tamper detection
        run: |
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          printf '%s\n' 'fixture wheel bytes' > "$tempdir/sample.whl"
          (cd "$tempdir" && sha256sum sample.whl > SHA256SUMS)
          bash scripts/verify-sha256-manifest.sh "$tempdir/SHA256SUMS"
          printf '%s\n' 'tampered bytes' > "$tempdir/sample.whl"
          if bash scripts/verify-sha256-manifest.sh "$tempdir/SHA256SUMS" >/dev/null 2>&1; then
            echo "Checksum verifier accepted a modified artifact." >&2
            exit 1
          fi
          echo "Modified artifact correctly rejected."
      - name: Validate Chromium extension JavaScript
        run: node --check browser-extension/service-worker.js && node --check browser-extension/popup.js && node --check src/netsentinel/static/scan-comparison.js
      - name: Test Chromium extension URL sanitizer, capture lifecycle and popup CSV
        run: node --test browser-extension/service-worker.test.cjs browser-extension/popup.test.cjs tests/topology_model.test.cjs
      - name: Validate extension manifest and opt-in defaults
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("browser-extension/manifest.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == 3, "Chromium extension must use Manifest V3"
          assert set(manifest["permissions"]) == {"storage", "webNavigation"}
          assert "host_permissions" not in manifest, "Do not request broad host access unnecessarily"
          assert "optional_host_permissions" not in manifest, "Do not request optional host access unnecessarily"
          assert "incognito" not in manifest, "Do not enable private browsing by default"
          for path in ("browser-extension/service-worker.js", "browser-extension/popup.js"):
              source = Path(path).read_text(encoding="utf-8")
              assert "enabled: false" in source, f"Tracking default must remain off in {path}"
          PY
      - name: Validate local interface JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          static_dir = Path("src/netsentinel/static")
          pages = {
              "index.html": ("/static/theme.js", "/static/topology.js", "/static/scan-comparison.js", "/static/index.js"),
              "monitors.html": ("/static/theme.js", "/static/section-tabs.js", "/static/monitors.js"),
              "activity.html": ("/static/theme.js", "/static/section-tabs.js", "/static/activity.js"),
              "findings.html": ("/static/theme.js", "/static/findings.js"),
              "tools.html": ("/static/theme.js", "/static/tools.js"),
          }

          for page_name, expected_scripts in pages.items():
              html = (static_dir / page_name).read_text(encoding="utf-8")
              scripts = list(re.finditer(
                  r"<script\b([^>]*)>(.*?)</script\s*>",
                  html,
                  flags=re.IGNORECASE | re.DOTALL,
              ))
              observed_scripts = []
              for script in scripts:
                  match = re.fullmatch(
                      r'src="(/static/[^"]+)"( defer)?',
                      script.group(1).strip(),
                  )
                  assert match, (
                      f"{page_name} contains a script with unexpected attributes: "
                      f"{script.group(1)}"
                  )
                  source = match.group(1)
                  observed_scripts.append(source)
                  assert not script.group(2).strip(), (
                      f"{page_name} must not contain inline JavaScript."
                  )
                  if source == "/static/theme.js":
                      assert match.group(2) is None, (
                          "The shared theme must apply before first paint."
                      )
                  else:
                      assert match.group(2) == " defer", (
                          f"{source} must load with defer."
                      )

              assert tuple(observed_scripts) == expected_scripts, (
                  f"{page_name} must load exactly {expected_scripts}, "
                  f"but loaded {tuple(observed_scripts)}."
              )
              for source in expected_scripts:
                  script_name = source.removeprefix("/static/")
                  assert (static_dir / script_name).is_file(), (
                      f"Missing frontend asset {script_name}."
                  )

          print("All five pages load the expected local scripts without inline JavaScript.")
          PY
          for script in src/netsentinel/static/*.js; do
            node --check "$script"
          done
      - name: Verify extension source files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "browser-extension/manifest.json",
              "browser-extension/service-worker.js",
              "browser-extension/popup.html",
              "browser-extension/popup.js",
              "browser-extension/README.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          assert not missing, f"Missing browser extension files: {missing}"
          PY
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel version and interface files
        run: |
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected one wheel, found: {wheels}"
          source = Path("src/netsentinel/__init__.py").read_text(encoding="utf-8")
          version_line = next(line for line in source.splitlines() if line.startswith("__version__"))
          expected_version = version_line.split("=", 1)[1].strip().strip(chr(34) + chr(39))

          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(wheel.read(metadata_path).decode("utf-8"))
              assert metadata["Version"] == expected_version, (
                  f"Package version {metadata['Version']} != source version {expected_version}"
              )
              required = {
                  "netsentinel/static/index.html",
                  "netsentinel/static/monitors.html",
                  "netsentinel/static/styles.css",
                  "netsentinel/static/monitors.css",
                  "netsentinel/static/activity.css",
                  "netsentinel/static/tools.css",
                  "netsentinel/static/findings.css",
                  "netsentinel/static/tools.html",
                  "netsentinel/static/activity.html",
                  "netsentinel/static/findings.html",
                  "netsentinel/static/theme.css",
                  "netsentinel/static/theme.js",
                  "netsentinel/static/section-tabs.js",
                  "netsentinel/static/topology.js",
                  "netsentinel/static/index.js",
                  "netsentinel/static/monitors.js",
                  "netsentinel/static/activity.js",
                  "netsentinel/static/findings.js",
                  "netsentinel/static/tools.js",
              }
              missing = required - names
              assert not missing, f"Missing UI assets in wheel: {sorted(missing)}"
          print(f"Validated NetSentinel {expected_version}: HTML, CSS and JavaScript included.")
          PY


  responsive-ui:
    name: Responsive UI / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser-test dependencies
        run: python -m pip install -e ".[test,ui-test]"
      - name: Install Chromium and its system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Check all main pages at representative viewport sizes
        run: python scripts/check_responsive_ui.py
