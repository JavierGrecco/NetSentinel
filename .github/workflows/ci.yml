name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest

  package:
    name: Wheel metadata and static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate launcher shell syntax
        run: bash -n run.sh run-macos.command
      - name: Validate Chromium extension JavaScript
        run: node --check browser-extension/service-worker.js && node --check browser-extension/popup.js
      - name: Test Chromium extension URL sanitizer, capture lifecycle and popup CSV
        run: node --test browser-extension/service-worker.test.cjs browser-extension/popup.test.cjs
      - name: Validate extension manifest and opt-in defaults
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("browser-extension/manifest.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == 3, "Chromium extension must use Manifest V3"
          assert set(manifest["permissions"]) == {"storage", "webNavigation"}
          assert "host_permissions" not in manifest, "Do not request broad host access unnecessarily"
          assert "optional_host_permissions" not in manifest, "Do not request optional host access unnecessarily"
          assert "incognito" not in manifest, "Do not enable private browsing by default"
          for path in ("browser-extension/service-worker.js", "browser-extension/popup.js"):
              source = Path(path).read_text(encoding="utf-8")
              assert "enabled: false" in source, f"Tracking default must remain off in {path}"
          PY
      - name: Validate embedded dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("src/netsentinel/static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.DOTALL)
          assert scripts, "No embedded script found in index.html"
          Path("dashboard-inline-check.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          PY
          node --check dashboard-inline-check.js
      - name: Validate embedded activity page JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("src/netsentinel/static/activity.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.DOTALL)
          assert scripts, "No embedded script found in activity.html"
          Path("activity-inline-check.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          PY
          node --check activity-inline-check.js
      - name: Validate embedded tools page JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("src/netsentinel/static/tools.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.DOTALL)
          assert scripts, "No embedded script found in tools.html"
          Path("tools-inline-check.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          PY
          node --check tools-inline-check.js
      - name: Verify extension source files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "browser-extension/manifest.json",
              "browser-extension/service-worker.js",
              "browser-extension/popup.html",
              "browser-extension/popup.js",
              "browser-extension/README.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          assert not missing, f"Missing browser extension files: {missing}"
          PY
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel version and interface files
        run: |
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected one wheel, found: {wheels}"
          source = Path("src/netsentinel/__init__.py").read_text(encoding="utf-8")
          version_line = next(line for line in source.splitlines() if line.startswith("__version__"))
          expected_version = version_line.split("=", 1)[1].strip().strip(chr(34) + chr(39))

          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(wheel.read(metadata_path).decode("utf-8"))
              assert metadata["Version"] == expected_version, (
                  f"Package version {metadata['Version']} != source version {expected_version}"
              )
              required = {
                  "netsentinel/static/index.html",
                  "netsentinel/static/monitors.html",
                  "netsentinel/static/styles.css",
                  "netsentinel/static/monitors.css",
                  "netsentinel/static/tools.html",
                  "netsentinel/static/activity.html",
              }
              missing = required - names
              assert not missing, f"Missing UI assets in wheel: {sorted(missing)}"
          print(f"Validated NetSentinel {expected_version}: HTML and CSS included.")
          PY
